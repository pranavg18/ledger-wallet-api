name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Lint (Spotless / google-java-format)
        run: ./mvnw -B -ntp spotless:check

      # Unit tests (surefire) + integration tests (failsafe) against a throwaway
      # PostgreSQL started by Testcontainers — an isolated database per run (TQ-5).
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not just the last commit

      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      - name: Gitleaks scan (full history)
        run: ./gitleaks git . --redact --verbose --exit-code 1

  validate-docs:
    name: validate-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Course material lives in docs/course/ locally and must never be in the repo.
      - name: Course files are not tracked
        run: |
          # docs/srs.pdf is the team's own exported SRS, so it may be committed.
          tracked="$(git ls-files 'docs/course/*' '*.pdf' '*.doc' '*.docx' | grep -vx 'docs/srs.pdf' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Course/binary documents must not be committed:"; echo "$tracked"; exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install validator dependencies (PyYAML)
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Test the validators
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Validate Agent Skills (SKILL.md frontmatter, naming, citations)
        run: python3 scripts/validate_skills.py

      - name: Validate brain notes (frontmatter schema, wikilinks, ADR citations)
        run: python3 scripts/validate_brain.py
