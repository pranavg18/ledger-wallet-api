name: Feature / task
description: New behaviour, documentation, brain note, skill or tooling work
labels: ["feature"]
body:
  - type: input
    id: task
    attributes:
      label: Task ID
      description: From IMPLEMENTATION_PLAN.md, e.g. T3.2
  - type: input
    id: requirements
    attributes:
      label: Requirement IDs
      description: From docs/srs.md, e.g. FR-2.3, TQ-4
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What needs to be done
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions, ideally phrased as tests
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options: ["Stage 1 - Requirements", "Stage 2 - Design", "Stage 3 - Testing & CI", "Stage 4 - Review"]
    validations:
      required: true
